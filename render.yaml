services:
  # ======================
  # Backend (Express API)
  # ======================
  - type: web
    name: cuetgo-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: 'true'
      - key: SEED_DEMO_DATA
        value: 'true'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # ======================
  # Frontend (React + Vite Static Site)
  # ======================
  - type: web
    name: cuetgo-frontend
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_API_URL
        fromService:
          name: cuetgo-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

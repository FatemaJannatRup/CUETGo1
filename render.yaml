services:
  # ======================
  # Backend (Express API)
  # ======================
  - type: web
    name: cuetgo-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # ======================
  # Frontend (React + Vite Static Site)
  # ======================
  - type: web
    name: cuetgo-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: cuetgo-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

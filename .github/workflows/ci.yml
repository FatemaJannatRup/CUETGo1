name: CUETGo build and syntax checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          for file in server/*.js server/routes/*.js server/services/*.js server/middleware/*.js server/constants/*.js; do
            node --check "$file"
          done

name: Dependency security audit

on:
  push:
    branches: [fix/security-and-experience]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate and safely patch frontend lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci --ignore-scripts
          npm run build
          npm audit --json > frontend-audit.json || true
      - name: Regenerate and safely patch backend lockfile
        working-directory: server
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci --ignore-scripts
          npm audit --json > ../backend-audit.json || true
      - name: Summarize audit findings
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          for (const file of ['frontend-audit.json','backend-audit.json']) {
            if (!fs.existsSync(file)) continue;
            const report = JSON.parse(fs.readFileSync(file,'utf8'));
            const v = report.metadata?.vulnerabilities || {};
            console.log(file, JSON.stringify({info:v.info||0,low:v.low||0,moderate:v.moderate||0,high:v.high||0,critical:v.critical||0,total:v.total||0}));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(name, JSON.stringify({severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, via:item.via?.map(x=>typeof x==='string'?x:x.title)}));
            }
          }
          NODE
      - name: Upload full audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cuetgo-npm-audit-reports
          path: |
            frontend-audit.json
            backend-audit.json
          if-no-files-found: warn
      - name: Commit regenerated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already current"
          else
            git commit -m "chore: refresh and patch npm lockfiles [skip ci]"
            git push
          fi
